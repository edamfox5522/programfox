<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ProgramFox - Juego de Banderas</title>
<style>
  /* Diseño del juego original (juego-paises-tiktok): tamaños FIJOS en píxeles,
     banderas en las orillas, reloj arriba al centro.
     Opciones en el enlace:  &zoom=1.3 (más grande)   &eventos=1 (avisos abajo a la izquierda) */
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

  /* ---------- Tablero principal ---------- */
  .board { display: flex; align-items: flex-start; justify-content: space-between; width: 100%; padding: 26px 16px 20px; gap: 10px; }
  .countries { display: flex; flex-direction: column; gap: 8px; width: 96px; }
  .country-card { position: relative; display: flex; align-items: center; justify-content: center; }
  .flag-wrap { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; }
  .flag-plate {
    position: relative; width: 62px; height: 62px; border-radius: 12px;
    background: rgba(10, 10, 18, 0.55); border: 2px solid rgba(255, 255, 255, 0.25);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
    transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
  }
  .flag-img { width: 100%; height: 100%; object-fit: cover; }
  .flag-fallback { width: 100%; height: 100%; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #fff; background: #333; }

  /* #1 (líder): corona dorada + resplandor */
  .country-card.leading .flag-plate { border-color: #ffd93d; box-shadow: 0 0 16px rgba(255, 217, 61, 0.75); transform: scale(1.08); }
  /* #2: plata */
  .country-card.silver .flag-plate { border-color: #d8dee8; box-shadow: 0 0 10px rgba(216, 222, 232, 0.55); transform: scale(1.03); }
  /* #3: bronce */
  .country-card.bronze .flag-plate { border-color: #cd7f32; box-shadow: 0 0 10px rgba(205, 127, 50, 0.55); transform: scale(1.015); }

  .rank-badge {
    position: absolute; top: -6px; left: -6px; width: 16px; height: 16px; border-radius: 50%;
    background: linear-gradient(180deg, #ffe066, #d9a300); border: 2px solid #fff8dd;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); z-index: 2;
  }
  .rank-badge.silver { background: linear-gradient(180deg, #f1f4f9, #b6bfcc); border-color: #ffffff; }
  .rank-badge.bronze { background: linear-gradient(180deg, #e3975a, #a85d23); border-color: #ffe0bd; }
  .crown { position: absolute; top: -22px; left: 0; right: 0; text-align: center; font-size: 18px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.6)); z-index: 2; }

  .country-points { margin-top: 4px; font-size: 17px; font-weight: 800; color: #fff; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9); min-height: 20px; }
  .country-card.leading .country-points { color: #ffd93d; }
  .country-card.silver .country-points { color: #d8dee8; }
  .country-card.bronze .country-points { color: #e3975a; }

  /* ---------- Centro: reloj ---------- */
  .center-info { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 6px; }
  .timer { font-size: 34px; font-weight: 300; color: #fff; letter-spacing: 2px; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7); display: inline-block; }
  /* Últimos 10s: rojo + pulso. Últimos 5s: pulso más rápido */
  .timer.timer-danger { color: #ff3b3b; animation: timerPulse 0.7s ease-in-out infinite; }
  .timer.timer-danger.timer-critical { animation-duration: 0.25s; }
  @keyframes timerPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }

  /* ---------- "+30s" cuando se agrega tiempo ---------- */
  .time-added-layer { position: absolute; top: 0; left: 50%; width: 0; height: 0; pointer-events: none; }
  .time-added { position: absolute; left: 0; top: 0; transform: translate(-50%, 0); font-size: 22px; font-weight: 800; white-space: nowrap; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8); animation: timeAddedFloat 1.4s ease forwards; }
  .time-added.positive { color: #4ade80; }
  .time-added.negative { color: #ff6b6b; }
  @keyframes timeAddedFloat {
    0% { opacity: 0; transform: translate(-50%, 6px) scale(0.7); }
    15% { opacity: 1; transform: translate(-50%, -4px) scale(1.15); }
    30% { opacity: 1; transform: translate(-50%, -8px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -46px) scale(1); }
  }

  /* ---------- Foto de perfil que "entra" a la bandera ---------- */
  .boost-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .boost-avatar {
    position: fixed; width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
    border: 3px solid #ffd93d; box-shadow: 0 0 16px rgba(255, 217, 61, 0.8);
    transform: translate(-50%, -50%) scale(0.3); animation: boostPop 0.8s ease forwards;
  }
  @keyframes boostPop {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    50% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -55%) scale(0.5); opacity: 0; }
  }
  .flag-plate.flag-joining { animation: flagJoinPop 0.65s ease; }
  @keyframes flagJoinPop {
    0% { box-shadow: 0 0 0 rgba(255, 217, 61, 0); transform: scale(1); }
    30% { box-shadow: 0 0 22px rgba(255, 217, 61, 0.95); transform: scale(1.18); }
    100% { box-shadow: 0 0 0 rgba(255, 217, 61, 0); transform: scale(1); }
  }

  /* ---------- Pantalla TOP 3 ---------- */
  .top3-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6); }
  .top3-overlay.show { display: flex; }
  .top3-card { background: rgba(10, 10, 15, 0.95); border: 3px solid #ffd93d; border-radius: 20px; padding: 40px 60px; text-align: center; box-shadow: 0 0 40px rgba(255, 217, 61, 0.5); }
  .top3-card h1 { color: #ffd93d; font-size: 40px; margin-bottom: 24px; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
  .top3-list { display: flex; flex-direction: column; gap: 14px; }
  .top3-row { display: flex; align-items: center; justify-content: space-between; gap: 30px; font-size: 26px; font-weight: 800; color: #fff; }
  .top3-row .medal { font-size: 30px; }
  .top3-flag { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); }
  .top3-row .pts { color: #ffd93d; }
  .top3-empty { font-size: 22px; color: #ddd; }

  /* ---------- Avisos (solo con &eventos=1) ---------- */
  .events-box { position: fixed; left: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 8px; width: 340px; }
  .event-item {
    display: flex; align-items: center; gap: 10px; background: rgba(10, 10, 15, 0.85); border-left: 4px solid #21b2c2;
    border-radius: 8px; padding: 8px 14px; color: #fff; font-size: 15px; font-weight: 600;
    animation: eventIn 0.3s ease, eventOut 0.4s ease 4.6s forwards; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  .event-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 2px solid rgba(255, 255, 255, 0.35); }
  @keyframes eventIn { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes eventOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-30px); } }
</style>
</head>
<body>
  <div class="board">
    <div class="countries countries-left" id="countriesLeft"></div>
    <div class="center-info">
      <div class="timer" id="timer">5:00</div>
      <div class="time-added-layer" id="timeAddedLayer"></div>
    </div>
    <div class="countries countries-right" id="countriesRight"></div>
  </div>
  <div class="boost-layer" id="boostLayer"></div>
  <div class="events-box" id="eventsBox"></div>
  <div class="top3-overlay" id="top3Overlay">
    <div class="top3-card">
      <h1>🏆 TOP 3 🏆</h1>
      <div class="top3-list" id="top3List"></div>
    </div>
  </div>

<script src="pf-config.js"></script>
<script src="supabase.js"></script>
<script src="pf-conexion.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get('zoom')) document.body.style.zoom = params.get('zoom');   // zoom = crece sin perder nitidez
  const EVENTOS = params.get('eventos') === '1';

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // solo códigos de país de verdad (ej: co, mx, gb-eng); cualquier otra cosa se ignora
  const flagUrl = (c) => { const k = String(c || '').toLowerCase(); return /^[a-z]{2}(-[a-z]{2,4})?$/.test(k) ? `https://flagcdn.com/h80/${k}.png` : ''; };
  const pts = (v) => String(Number(v) || 0);
  const $ = (id) => document.getElementById(id);

  let state = null;
  let remaining = 0;
  let lastRemaining = null;
  let top3Shown = false;
  let top3Timer = null;

  // ---------- Banderas ----------
  // Ranking GLOBAL: se ordenan todos por puntos; la mitad de arriba va a la
  // izquierda y el resto a la derecha (un país puede pasar de un lado al otro).
  function renderCountries() {
    const sorted = state.countries
      .map((c, i) => ({ c, i }))
      .sort((a, b) => (b.c.coins - a.c.coins) || (a.i - b.i))
      .map(({ c }) => c);
    const half = Math.ceil(sorted.length / 2);
    $('countriesLeft').innerHTML = sorted.slice(0, half).map((c, i) => renderCard(c, i + 1)).join('');
    $('countriesRight').innerHTML = sorted.slice(half).map((c, i) => renderCard(c, half + i + 1)).join('');
  }

  function renderCard(c, position) {
    let badge = '', cls = '';
    if (position === 1 && c.points > 0) { badge = '<span class="crown">👑</span>'; cls = 'leading'; }
    else if (position === 2 && c.points > 0) { badge = '<span class="rank-badge silver"></span>'; cls = 'silver'; }
    else if (position === 3 && c.points > 0) { badge = '<span class="rank-badge bronze"></span>'; cls = 'bronze'; }
    return `
      <div class="country-card ${cls}" title="${esc(c.name)}" data-code="${esc(c.code)}">
        <div class="flag-wrap">
          ${badge}
          <div class="flag-plate">
            <img class="flag-img" src="${flagUrl(c.code)}" alt="${esc(c.name)}"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="flag-fallback" style="display:none;">${esc(String(c.name).slice(0, 3).toUpperCase())}</div>
          </div>
          <div class="country-points">${pts(c.points)}</div>
        </div>
      </div>`;
  }

  // ---------- Reloj ----------
  function renderTimer() {
    const t = $('timer');
    const secs = state && state.running ? Math.max(0, remaining) : (state ? (state.duration || 300) : 300);
    t.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    const on = !!(state && state.running && !state.paused);
    t.classList.toggle('timer-danger', on && secs > 0 && secs <= 10);
    t.classList.toggle('timer-critical', on && secs > 0 && secs <= 5);
  }

  // "+30s" si al reloj le sumaron tiempo
  function checkTimeAdded() {
    if (state && state.running && lastRemaining !== null) {
      const diff = remaining - lastRemaining;
      if (diff >= 3) spawnTimeAdded(diff);
    }
    lastRemaining = state && state.running ? remaining : null;
  }
  function spawnTimeAdded(seconds) {
    const el = document.createElement('div');
    el.className = 'time-added ' + (seconds > 0 ? 'positive' : 'negative');
    el.textContent = `${seconds > 0 ? '+' : '−'}${Math.abs(seconds)}s`;
    $('timeAddedLayer').appendChild(el);
    setTimeout(() => el.remove(), 1400);
  }

  // ---------- Entrar a la bandera (foto de perfil o pulso) ----------
  function spawnBoost(code, avatar) {
    const plate = document.querySelector(`[data-code="${CSS.escape(code)}"] .flag-plate`);
    if (!plate) return;
    if (!avatar) return flashFlagPlate(plate);
    const r = plate.getBoundingClientRect();
    const img = document.createElement('img');
    img.className = 'boost-avatar';
    img.referrerPolicy = 'no-referrer';
    img.src = avatar;
    img.style.left = `${r.left + r.width / 2}px`;
    img.style.top = `${r.top + r.height / 2}px`;
    img.onerror = () => { img.remove(); flashFlagPlate(plate); };
    $('boostLayer').appendChild(img);
    setTimeout(() => img.remove(), 800);
  }
  function flashFlagPlate(plate) {
    plate.classList.remove('flag-joining');
    void plate.offsetWidth;
    plate.classList.add('flag-joining');
    setTimeout(() => plate.classList.remove('flag-joining'), 650);
  }

  // ---------- TOP 3 (se ve 15 segundos) ----------
  function renderTop3() {
    const box = $('top3Overlay');
    if (state.running || !state.top3) {
      box.classList.remove('show');
      top3Shown = false;
      clearTimeout(top3Timer);
      return;
    }
    if (top3Shown) return;
    top3Shown = true;
    const medals = ['🥇', '🥈', '🥉'];
    $('top3List').innerHTML = state.top3.length ? state.top3.map((c, i) => `
      <div class="top3-row">
        <span class="medal">${medals[i] || ''}</span>
        <img class="top3-flag" src="${flagUrl(c.code)}" alt="" onerror="this.style.display='none';">
        <span>${esc(c.name)}</span>
        <span class="pts">${pts(c.points)} pts</span>
      </div>`).join('') : '<div class="top3-empty">Nadie sumó puntos esta ronda 😅</div>';
    box.classList.add('show');
    clearTimeout(top3Timer);
    top3Timer = setTimeout(() => box.classList.remove('show'), 15000);
  }

  // ---------- Avisos abajo a la izquierda (opcional) ----------
  function addEvent(text, avatar) {
    const box = $('eventsBox');
    const el = document.createElement('div');
    el.className = 'event-item';
    el.innerHTML = `${avatar ? `<img class="event-avatar" src="${esc(avatar)}" referrerpolicy="no-referrer" onerror="this.style.display='none';">` : ''}<span>${esc(text)}</span>`;
    box.appendChild(el);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => el.remove(), 5000);
  }

  function render() {
    if (!state) return;
    renderCountries();
    renderTimer();
    renderTop3();
  }

  // ---------- conexión con ProgramFox (tu PC o la nube) ----------
  pfConnect((m) => {
    if (m.type === 'banderas-state') {
      state = m.state;
      remaining = state.remaining;
      checkTimeAdded();
      render();
    } else if (m.type === 'banderas-time') {
      remaining = m.remaining;
      checkTimeAdded();
      renderTimer();
    } else if (m.type === 'banderas-feed') {
      if (m.code) spawnBoost(m.code, m.avatar);
      if (EVENTOS && m.text) addEvent(m.text, m.avatar);
    }
  }, 'banderas');
</script>
</body>
</html>
