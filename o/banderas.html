<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ProgramFox - Juego de Banderas</title>
<style>
  /* Medidas pensadas para 1080x1920 (vertical). 1em = 10px en ese tamaño.
     Se adapta sola a cualquier tamaño. Escala extra: /banderas?scale=1.2 */
  :root { --scale: 1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: "Segoe UI", "Arial Black", system-ui, sans-serif; color: #fff;
    font-size: calc(min(100vw / 1080, 100vh / 1920) * 10 * var(--scale));
  }
  .wrap { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 108em; height: 100%; }

  /* ---------- reloj ---------- */
  .timer {
    position: absolute; top: 5em; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 1.6em;
    background: rgba(15, 12, 22, .85); border: .3em solid rgba(255,255,255,.14);
    padding: 1.2em 3.2em; border-radius: 10em; box-shadow: 0 .8em 2.4em rgba(0,0,0,.45);
    font-weight: 900; white-space: nowrap;
  }
  .timer .round { font-size: 3em; color: #ffb35c; }
  .timer .time { font-size: 5.6em; font-variant-numeric: tabular-nums; line-height: 1; }
  .timer.low .time { color: #ff5470; animation: blink 1s infinite; }
  .timer .msg { font-size: 3.8em; }
  @keyframes blink { 50% { opacity: .45; } }

  /* ---------- columnas de países ---------- */
  .col { position: absolute; top: 20em; display: flex; flex-direction: column; gap: 1.2em; width: 33em; }
  .col.left { left: 1.6em; }
  .col.right { right: 1.6em; }
  .card {
    position: relative; height: 11.8em; display: flex; align-items: center; gap: 1.2em;
    padding: 0 1.4em; border-radius: 1.8em;
    background: linear-gradient(90deg, rgba(20,16,30,.9), rgba(20,16,30,.66));
    border: .3em solid rgba(255,255,255,.12);
    box-shadow: 0 .5em 1.6em rgba(0,0,0,.4);
    transition: transform .25s, border-color .3s, box-shadow .3s;
  }
  .col.right .card { flex-direction: row-reverse; text-align: right; }
  .card img, .card .code { width: 7.6em; height: 5.1em; border-radius: .8em; flex: none; box-shadow: 0 0 0 .25em rgba(255,255,255,.25); }
  .card img { object-fit: cover; }
  .card .code { display: none; place-items: center; background: #3a3346; font-weight: 900; font-size: 1em; }
  .card .code span { font-size: 2.4em; }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-size: 2.7em; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 .1em .2em #000; }
  .card .line { display: flex; align-items: baseline; gap: 1em; }
  .col.right .card .line { flex-direction: row-reverse; }
  .card .pts { font-size: 4.6em; font-weight: 900; line-height: 1.05; color: #ffd24a; text-shadow: 0 .06em .15em #000; font-variant-numeric: tabular-nums; }
  .card .pts small { font-size: .45em; color: #e6dcb0; margin-left: .15em; }
  .card .users { font-size: 2em; color: #cfc7de; white-space: nowrap; }
  .card.leader { border-color: #ffd24a; box-shadow: 0 0 2.6em rgba(255, 210, 74, .6); }
  .card.leader::before { content: '👑'; position: absolute; font-size: 4em; top: -.55em; }
  .col.left .card.leader::before { right: .15em; }
  .col.right .card.leader::before { left: .15em; }
  .card.bump { transform: scale(1.07); border-color: #25f4ee; }
  .card .rank { position: absolute; bottom: -.5em; font-size: 1.9em; font-weight: 900; background: #fe2c55; border-radius: .4em; padding: 0 .4em; }
  .col.left .card .rank { left: -.3em; }
  .col.right .card .rank { right: -.3em; }

  /* ---------- feed (esquina inferior izquierda) ---------- */
  .feed { position: absolute; left: 1.6em; bottom: 6em; display: flex; flex-direction: column-reverse; gap: 1em; max-width: 80em; }
  .fi {
    display: flex; align-items: center; gap: 1.2em;
    background: rgba(15, 12, 22, .88); border-left: .6em solid #fe2c55;
    padding: 1em 2em 1em 1.2em; border-radius: 1.2em;
    box-shadow: 0 .5em 1.4em rgba(0,0,0,.4);
    animation: fin .35s ease-out;
  }
  .fi span { font-size: 2.6em; font-weight: 700; }
  .fi img.av { width: 5em; height: 5em; border-radius: 50%; object-fit: cover; }
  .fi img.fl { width: 5.4em; height: 3.6em; object-fit: cover; border-radius: .5em; }
  .fi.out { animation: fout .45s ease-in forwards; }
  @keyframes fin { from { opacity: 0; transform: translateX(-5em); } }
  @keyframes fout { to { opacity: 0; transform: translateX(-5em); } }

  /* ---------- TOP 3 ---------- */
  .top3 {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.8); opacity: 0;
    width: 80em; padding: 4em 3em 4.5em; border-radius: 4em; text-align: center;
    background: radial-gradient(circle at 50% 0%, rgba(255,210,74,.35), rgba(18,14,28,.95) 60%);
    border: .4em solid rgba(255,210,74,.6); box-shadow: 0 1.5em 6em rgba(0,0,0,.6);
    transition: all .45s cubic-bezier(.2,1.4,.4,1); pointer-events: none;
  }
  .top3.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .top3 h1 { margin: 0; font-size: 7em; font-weight: 900; }
  .top3 .sub { font-size: 3em; color: #d8cfe6; margin-bottom: 1.2em; }
  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 2em; }
  .pl { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .pl img { width: 13em; height: 8.7em; object-fit: cover; border-radius: 1em; box-shadow: 0 0 0 .35em rgba(255,255,255,.3); }
  .pl.p1 img { width: 17em; height: 11.3em; }
  .pl .medal { font-size: 7em; line-height: 1; }
  .pl .pname { font-size: 3.2em; font-weight: 900; margin-top: .3em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl .ppts { font-size: 4.4em; font-weight: 900; color: #ffd24a; }
  .pl .mvp { font-size: 2.2em; color: #cfc7de; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl .base { width: 100%; margin-top: 1em; border-radius: 1.4em 1.4em 0 0; background: linear-gradient(#ff7a18, #fe2c55); }
  .pl.p1 .base { height: 16em; }
  .pl.p2 .base { height: 11em; background: linear-gradient(#c9d6e3, #7f8fa6); }
  .pl.p3 .base { height: 7.5em; background: linear-gradient(#e0a060, #a0522d); }
  .nobody { font-size: 3.6em; color: #d8cfe6; padding: 1em 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="timer" id="timer"><span class="msg">🌎 ¡Escribe tu país!</span></div>
    <div class="col left" id="left"></div>
    <div class="col right" id="right"></div>
    <div class="feed" id="feed"></div>
    <div class="top3" id="top3"></div>
  </div>

<script src="pf-config.js"></script>
<script src="supabase.js"></script>
<script src="pf-conexion.js"></script>
<script>
  // Escala opcional:  /banderas?scale=1.2
  const params = new URLSearchParams(location.search);
  if (params.get('scale')) document.documentElement.style.setProperty('--scale', params.get('scale'));

  const flag = (c) => `https://flagcdn.com/w160/${String(c || '').toLowerCase()}.png`;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

  let state = null;
  let prevCoins = {};
  let remaining = 0;

  document.addEventListener('error', (e) => {
    const img = e.target;
    if (img && img.tagName === 'IMG') {
      img.style.display = 'none';
      if (img.nextElementSibling && img.nextElementSibling.classList.contains('code')) img.nextElementSibling.style.display = 'grid';
    }
  }, true);

  function renderTimer() {
    const t = document.getElementById('timer');
    if (!state) return;
    if (state.running) {
      t.className = 'timer' + (remaining <= 30 && !state.paused ? ' low' : '');
      t.innerHTML = `<span class="round">RONDA ${state.round}</span><span class="time">${state.paused ? '⏸ ' : '⏱ '}${mmss(remaining)}</span>`;
    } else if (state.top3) {
      t.className = 'timer';
      t.innerHTML = `<span class="msg">🏆 ¡Fin de la ronda ${state.round}!</span>`;
    } else {
      t.className = 'timer';
      t.innerHTML = `<span class="msg">🌎 ¡Escribe tu país en el chat!</span>`;
    }
  }

  function cardHtml(c, rank) {
    return `
      <div class="card ${state.leader === c.code ? 'leader' : ''}" data-code="${esc(c.code)}">
        <img src="${flag(c.code)}"><div class="code"><span>${esc(c.code.toUpperCase())}</span></div>
        <div class="info">
          <div class="name">${esc(c.name)}</div>
          <div class="line">
            <div class="pts">${c.points}<small>pts</small></div>
            <div class="users">👥 ${c.users}</div>
          </div>
        </div>
        ${c.coins > 0 ? `<div class="rank">#${rank}</div>` : ''}
      </div>`;
  }

  function render() {
    if (!state) return;
    const ranking = state.countries.slice().sort((a, b) => b.coins - a.coins || a.index - b.index);
    const rankOf = {};
    ranking.forEach((c, i) => rankOf[c.code] = i + 1);
    const list = state.countries; // orden fijo
    document.getElementById('left').innerHTML = list.slice(0, 8).map(c => cardHtml(c, rankOf[c.code])).join('');
    document.getElementById('right').innerHTML = list.slice(8, 15).map(c => cardHtml(c, rankOf[c.code])).join('');

    // animación cuando un país suma
    for (const c of list) {
      if (prevCoins[c.code] !== undefined && c.coins > prevCoins[c.code]) {
        const el = document.querySelector(`.card[data-code="${CSS.escape(c.code)}"]`);
        if (el) { el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 450); }
      }
      prevCoins[c.code] = c.coins;
    }

    // TOP 3
    const box = document.getElementById('top3');
    if (state.top3) {
      const [a, b, c] = state.top3;
      const pl = (x, cls, medal) => x ? `
        <div class="pl ${cls}">
          <div class="medal">${medal}</div>
          <img src="${flag(x.code)}">
          <div class="pname">${esc(x.name)}</div>
          <div class="ppts">${x.points} pts</div>
          ${x.mvp ? `<div class="mvp">⭐ MVP: ${esc(x.mvp)}</div>` : ''}
          <div class="base"></div>
        </div>` : '<div class="pl"></div>';
      box.innerHTML = `
        <h1>🏆 TOP 3</h1>
        <div class="sub">Ronda ${state.round}</div>
        ${state.top3.length ? `<div class="podium">${pl(b, 'p2', '🥈')}${pl(a, 'p1', '🥇')}${pl(c, 'p3', '🥉')}</div>`
                            : '<div class="nobody">Nadie sumó puntos esta ronda 😅</div>'}`;
      box.classList.add('show');
    } else {
      box.classList.remove('show');
    }
    renderTimer();
  }

  // ---------- feed: máximo 3 mensajes, cada uno dura 5 segundos ----------
  function addFeed(m) {
    const feed = document.getElementById('feed');
    const div = document.createElement('div');
    div.className = 'fi';
    div.innerHTML =
      (m.avatar ? `<img class="av" src="${esc(m.avatar)}">` : '') +
      (m.code ? `<img class="fl" src="${flag(m.code)}">` : '') +
      `<span>${esc(m.text)}</span>`;
    feed.prepend(div);
    while (feed.children.length > 3) feed.lastElementChild.remove();
    setTimeout(() => {
      div.classList.add('out');
      setTimeout(() => div.remove(), 450);
    }, 5000);
  }

  // ---------- conexión con ProgramFox (tu PC o la nube) ----------
  pfConnect((m) => {
    if (m.type === 'banderas-state') {
      state = m.state;
      remaining = state.remaining;
      render();
    } else if (m.type === 'banderas-time') {
      remaining = m.remaining;
      renderTimer();
    } else if (m.type === 'banderas-feed') {
      addFeed(m);
    }
  }, 'banderas');
</script>
</body>
</html>
