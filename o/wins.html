  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: var(--fuente), 'PFWin', 'Segoe UI', sans-serif; font-weight: 800; color: #fff; display: grid; place-items: center; }
  :root { --c: #ff9a3c; --c2: #ffd29a; --c3: #c0661a; --glow: rgba(255,154,60,.55); --fuente: 'PFWin'; --tamT: 34px; --esp: 1.5px; --colT: #fff; --tamN: 128px; --colN: #fff; --colR: #fff; --bar: linear-gradient(90deg, var(--c3), var(--c), var(--c2)); --stroke: 0px; --colB: #000; --fondo: none; }
  .stage { width: 700px; height: 330px; position: relative; display: grid; place-items: center; }
  .halo { position: absolute; left: 50%; top: 52%; width: 560px; height: 300px; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(ellipse at center, var(--glow) 0%, transparent 66%); filter: blur(14px); opacity: .7; animation: respira 3.2s ease-in-out infinite; pointer-events: none; }
  @keyframes respira { 50% { transform: translate(-50%, -50%) scale(1.1); opacity: .45; } }
  .bloque { position: relative; display: flex; flex-direction: column; align-items: flex-start; padding: 18px 30px; border-radius: 26px; }
  .confondo .bloque { background: var(--fondo); box-shadow: 0 12px 30px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.06); }
  .cab { display: flex; align-items: center; gap: 12px; margin-left: 4px; }
  .icono { width: 54px; height: 54px; display: grid; place-items: center; font-size: 44px; line-height: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,.55)); }
  .icono svg, .icono img { width: 54px; height: 54px; object-fit: contain; }
  .sinimg .icono { display: none; }
  .titulo { font-size: var(--tamT); letter-spacing: var(--esp); color: var(--colT); text-transform: uppercase; text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.55); white-space: nowrap; }
  /* números grandes */
  .cifra { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; line-height: 1; }
  .num { display: flex; font-size: var(--tamN); letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .dig { position: relative; display: inline-block; width: .6em; height: 1em; text-align: center; }
  .dig span { position: absolute; left: 0; right: 0; top: 0; }
  .dig span.sale { animation: sale .42s cubic-bezier(.5, 0, .75, .3) forwards; }
  .dig span.entra { animation: entra .55s cubic-bezier(.2, 1.35, .35, 1); }
  @keyframes sale { to { transform: translateY(-62%) scaleY(1.2); opacity: 0; filter: blur(2px); } }
  @keyframes entra { from { transform: translateY(62%) scaleY(1.2); opacity: 0; filter: blur(2px); } }
  .num .dig span, .meta { background: linear-gradient(180deg, var(--c2) 8%, var(--c) 52%, var(--c3) 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)) drop-shadow(0 0 16px var(--glow)); }
  .meta { font-size: calc(var(--tamN) * .5); opacity: .85; letter-spacing: -1px; }
  .meta b { font-weight: 800; }
  .num.golpe { animation: golpe .5s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes golpe { 0% { transform: scale(1.1); } 100% { transform: none; } }
  /* barra de avance */
  .barra { width: 100%; height: 10px; border-radius: 10px; background: rgba(255,255,255,.14); margin: 10px 0 0; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
  .barra i { display: block; height: 100%; width: 0; border-radius: 10px; background: var(--bar); box-shadow: 0 0 12px var(--glow); transition: width .6s cubic-bezier(.2, 1, .3, 1); }
  .regla { margin: 10px 0 0 4px; font-size: 26px; color: var(--colR); text-transform: uppercase; letter-spacing: .3px; text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.5); white-space: nowrap; }
  /* título con degradado del color principal */
  .tdeg .titulo { background: linear-gradient(180deg, var(--c2) 8%, var(--c) 52%, var(--c3) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* números de un color fijo */
  .nfijo .num .dig span, .nfijo .meta { background: none; color: var(--colN); filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)) drop-shadow(0 0 12px var(--glow)); }
  /* borde de las letras */
  .conborde .titulo, .conborde .regla, .conborde .num .dig span, .conborde .meta { -webkit-text-stroke: var(--stroke) var(--colB); paint-order: stroke fill; }
  /* negativo */
  .neg { --c: var(--negc, #ff4545); --c2: var(--negc2, #ffb0a8); --c3: var(--negc3, #b3121b); --glow: var(--negglow, rgba(255,45,45,.6)); --colN: var(--negc, #ff4545); }
  /* meta cumplida */
  .cumplida .halo { opacity: 1; animation-duration: 1.2s; }
  .cumplida .regla { color: var(--c2); }
  .mas { position: absolute; right: 18px; top: 70px; font-size: 54px; color: #4dff7c; text-shadow: 0 3px 0 rgba(0,0,0,.5), 0 0 14px rgba(60,255,120,.5); pointer-events: none; animation: sube 1.3s ease-out forwards; }
  .mas.menos { color: #ff5252; text-shadow: 0 3px 0 rgba(0,0,0,.5), 0 0 14px rgba(255,60,60,.5); }
  @keyframes sube { 0% { transform: translateY(16px) scale(.6); opacity: 0; } 22% { transform: scale(1.12); opacity: 1; } 100% { transform: translateY(-64px); opacity: 0; } }
  .icono.salta { animation: salta .7s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes salta { 0% { transform: scale(1.45) rotate(-14deg); } 100% { transform: none; } }
  .confeti { position: absolute; width: 10px; height: 16px; top: -12px; border-radius: 2px; pointer-events: none; animation: cae var(--t) linear forwards; z-index: 3; }
  @keyframes cae { to { transform: translateY(370px) rotate(760deg); opacity: 0; } }
  .rayo { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.55), transparent 60%); animation: rayo .7s ease-out forwards; }
  @keyframes rayo { from { opacity: 1; } to { opacity: 0; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="halo"></div>
  <div class="bloque">
    <div class="cab"><div class="icono" id="icono"></div><div class="titulo" id="titulo">Win Game</div></div>
    <div class="cifra"><div class="num" id="num"></div><div class="meta">/<b id="meta">5</b></div></div>
    <div class="barra"><i id="barra"></i></div>
    <div class="regla" id="regla">Faltan 5 para la meta</div>
  </div>
</div>
<script src="pf-config.js"></script>
<script src="supabase.js"></script>
<script src="pf-conexion.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const DEMO = q.get('preview') === '1';
  const COLOR_URL = /^[0-9a-f]{6}$/i.test(q.get('color') || '') ? '#' + q.get('color') : '';
  const stage = document.getElementById('stage'), numEl = document.getElementById('num');
  function ajustar() { const z = Math.min(innerWidth / 700, innerHeight / 330) * (Number(q.get('zoom')) || 1); stage.style.zoom = z > 0 ? z : 1; }
  addEventListener('resize', ajustar); ajustar();

  function mezcla(hex, con, p) {
    const a = parseInt(hex.slice(1), 16), b = parseInt(con.slice(1), 16);
    const c = (s) => Math.round(((a >> s) & 255) * (1 - p) + ((b >> s) & 255) * p);
    return '#' + [16, 8, 0].map(s => c(s).toString(16).padStart(2, '0')).join('');
  }
  function ponerColor(hex) {
    const c = COLOR_URL || hex || '#ff9a3c', r = document.documentElement.style;
    r.setProperty('--c', c); r.setProperty('--c2', mezcla(c, '#ffffff', .55)); r.setProperty('--c3', mezcla(c, '#000000', .25));
    const n = parseInt(c.slice(1), 16); r.setProperty('--glow', `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},.55)`);
  }
  // trofeos dibujados (diseño propio)
  function copa(c1, c2, c3) {
    const id = 'g' + Math.random().toString(36).slice(2, 7);
    return `<svg viewBox="0 0 64 64"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset=".55" stop-color="${c2}"/><stop offset="1" stop-color="${c3}"/></linearGradient></defs>
      <path d="M14 10h36v6c0 13-7 22-18 24C21 38 14 29 14 16z" fill="url(#${id})"/>
      <path d="M14 14H6c0 9 5 15 12 16M50 14h8c0 9-5 15-12 16" fill="none" stroke="${c2}" stroke-width="4" stroke-linecap="round"/>
      <rect x="28" y="39" width="8" height="9" fill="${c3}"/><rect x="19" y="47" width="26" height="7" rx="2" fill="url(#${id})"/><rect x="15" y="53" width="34" height="6" rx="2" fill="${c3}"/>
      <path d="M22 15c0 9 3 15 7 18" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/></svg>`;
  }
  const ICONOS = {
    'copa': () => copa('#fff3a8', '#f5c021', '#b8780a'), 'copa-morada': () => copa('#e9c8ff', '#9b4dff', '#5a1fa8'),
    'copa-plata': () => copa('#ffffff', '#c9d4de', '#7b8a99'), 'copa-roja': () => copa('#ffc2b8', '#ff4a3a', '#a3160c'),
    'corona': () => '👑', 'medalla': () => '🏅', 'estrella': () => '⭐', 'fuego': () => '🔥', 'diamante': () => '💎', 'control': () => '🎮'
  };
  // números que ruedan
  let texto = '';
  function pintarNum(t) {
    if (t === texto) return;
    if (t.length !== texto.length) { numEl.innerHTML = [...t].map(ch => `<span class="dig"><span>${ch}</span></span>`).join(''); texto = t; return; }
    [...t].forEach((ch, i) => {
      if (ch === texto[i]) return;
      const d = numEl.children[i], viejo = d.lastElementChild;
      if (viejo) { viejo.className = 'sale'; setTimeout(() => viejo.remove(), 430); }
      const s = document.createElement('span'); s.className = 'entra'; s.textContent = ch; d.appendChild(s);
    });
    texto = t;
  }
  const FUENTES = { outfit: "'PFWin'", arial: 'Arial', impact: 'Impact', segoe: "'Segoe UI'", verdana: 'Verdana', georgia: 'Georgia', trebuchet: "'Trebuchet MS'", comic: "'Comic Sans MS'", courier: "'Courier New'" };
  const rgba = (h, a) => { const n = parseInt(String(h || '#000000').slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
  let W = { meta: 5, conteo: 0, cfg: {} };
  function pintar(w) {
    const c = w.cfg || {};
    ponerColor(c.color);
    const r = document.documentElement.style, B = document.body.classList;
    // fondo
    const op = (c.fondoOpacidad == null ? 80 : c.fondoOpacidad) / 100;
    const est = c.fondoEstilo || (c.fondo ? 'color' : 'ninguno');
    r.setProperty('--fondo', est === 'degradado' ? `linear-gradient(135deg, ${rgba(c.fondoColor, op)}, ${rgba(c.fondoColor2, op)})` : rgba(c.fondoColor || '#0e0c14', op));
    B.toggle('confondo', est !== 'ninguno');
    // texto
    r.setProperty('--fuente', FUENTES[c.fuente] || "'PFWin'");
    r.setProperty('--tamT', (Number(c.tamTitulo) || 34) + 'px');
    r.setProperty('--esp', (c.espaciado == null ? 1.5 : Number(c.espaciado)) + 'px');
    r.setProperty('--colT', c.colorTitulo || '#ffffff');
    B.toggle('tdeg', c.tituloEstilo === 'degradado');
    B.toggle('conborde', !!c.borde && Number(c.grosorBorde) > 0);
    r.setProperty('--stroke', (Number(c.grosorBorde) || 0) + 'px'); r.setProperty('--colB', c.colorBorde || '#000000');
    // contadores
    r.setProperty('--tamN', (Number(c.tamNum) || 128) + 'px');
    B.toggle('nfijo', c.numEstilo === 'color');
    r.setProperty('--colN', c.colorNum || '#ffffff');
    r.setProperty('--colR', c.colorRegla || '#ffffff');
    r.setProperty('--bar', c.colorBarra ? c.colorBarra : 'linear-gradient(90deg, var(--c3), var(--c), var(--c2))');
    const ng = c.colorNeg || '#ff4545';
    r.setProperty('--negc', ng); r.setProperty('--negc2', mezcla(ng, '#ffffff', .55)); r.setProperty('--negc3', mezcla(ng, '#000000', .3)); r.setProperty('--negglow', rgba(ng, .6));
    // imagen
    const ic = document.getElementById('icono');
    const tipo = c.imagenTipo || 'icono';
    B.toggle('sinimg', tipo === 'ninguna' || (tipo === 'propia' && !c.imagenUrl));
    const clave = tipo === 'propia' ? 'img:' + (c.imagenUrl || '') : (c.icono || 'copa');
    if (ic.dataset.k !== clave) {
      if (tipo === 'propia' && c.imagenUrl) { const im = document.createElement('img'); im.src = window.pfMedia ? window.pfMedia(c.imagenUrl) : c.imagenUrl; im.referrerPolicy = 'no-referrer'; ic.innerHTML = ''; ic.appendChild(im); }
      else ic.innerHTML = (ICONOS[c.icono] || ICONOS.copa)();
      ic.dataset.k = clave;
    }
    const t = document.getElementById('titulo'); t.textContent = c.titulo || ''; t.style.display = c.titulo ? '' : 'none';
    const n = Number(w.conteo) || 0, m = Math.max(1, Number(w.meta) || 1);
    pintarNum(String(n));
    document.getElementById('meta').textContent = m;
    document.getElementById('barra').style.width = Math.max(0, Math.min(100, (n / m) * 100)) + '%';
    const falta = m - n;
    document.getElementById('regla').textContent = n < 0 ? 'Conteo en negativo' : falta > 0 ? `Faltan ${falta} para la meta` : (falta === 0 ? '¡Meta cumplida!' : `¡Meta superada por ${-falta}!`);
    document.body.classList.toggle('neg', n < 0);
    document.body.classList.toggle('cumplida', n >= m);
  }
  function suma(s) {
    numEl.classList.remove('golpe'); void numEl.offsetWidth; numEl.classList.add('golpe');
    const d = document.createElement('div'); d.className = 'mas' + (s.suma < 0 ? ' menos' : ''); d.textContent = (s.suma > 0 ? '+' : '') + s.suma;
    stage.appendChild(d); setTimeout(() => d.remove(), 1400);
    if (s.suma > 0) { const ic = document.getElementById('icono'); ic.classList.remove('salta'); void ic.offsetWidth; ic.classList.add('salta'); }
    if (s.llego) {
      const r = document.createElement('div'); r.className = 'rayo'; stage.appendChild(r); setTimeout(() => r.remove(), 800);
      const cols = ['#ffd43c', getComputedStyle(document.documentElement).getPropertyValue('--c').trim() || '#ff9a3c', '#4dff7c', '#3c8cff', '#ff5c93', '#b44dff', '#ffffff'];
      for (let i = 0; i < 80; i++) { const c = document.createElement('div'); c.className = 'confeti'; c.style.left = Math.random() * 700 + 'px'; c.style.background = cols[i % cols.length]; c.style.setProperty('--t', (1.3 + Math.random() * 1.5) + 's'); c.style.animationDelay = Math.random() * .6 + 's'; stage.appendChild(c); setTimeout(() => c.remove(), 3400); }
    }
  }
  pintar(W);
  if (DEMO) {
    W.conteo = 3; pintar(W);
    setInterval(() => { const antes = W.conteo; W.conteo = W.conteo >= W.meta ? 0 : W.conteo + 1; pintar(W); if (W.conteo > antes) suma({ suma: 1, llego: W.conteo === W.meta }); }, 3000);
  }
  pfConnect((m) => {
    if (m.type === 'wins' && m.wins) { if (DEMO) { W.cfg = m.wins.cfg; W.meta = m.wins.meta; } else W = m.wins; pintar(W); }
    if (m.type === 'wins-suma' && m.suma && !DEMO) suma(m.suma);
  }, 'wins');
</script>
